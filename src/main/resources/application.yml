spring:
  application:
    name: tezza-lending
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tezza_lending}
    username: ${DB_USERNAME:tezza}
    password: ${DB_PASSWORD:tezza_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: tezza-lending-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.tezza.lending.*"
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      authorizationserver:
        issuer-uri: ${TEZZA_ISSUER_URI:http://localhost:8080}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
tezza:
  notification:
    due-reminder-days-before: 3
  auth:
    admin-client-secret: ${TEZZA_ADMIN_CLIENT_SECRET:admin-secret}
    mobile-client-secret: ${TEZZA_MOBILE_CLIENT_SECRET:mobile-secret}
    jwt-private-key: ${TEZZA_JWT_PRIVATE_KEY:}
logging:
  level:
    com.tezza.lending: INFO
    org.springframework.security: WARN
    org.springframework.kafka: WARN
